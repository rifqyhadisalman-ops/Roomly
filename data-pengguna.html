<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Data Pengguna | Roomly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="pengguna">
  <div class="layout">
    <aside id="sidebar"></aside>
    <main class="main">
      <h1 class="page-title">Data Pengguna</h1>
      <div class="subtitle">Kelola akun mahasiswa yang menggunakan layanan Roomly.</div>
      <div class="d-flex gap-2 mb-3" style="max-width:640px">
        <div class="input-group"><span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
          <input id="q" class="form-control border-0" placeholder="Cari Nama Pengguna">
        </div><button class="btn btn-roomly" onclick="cari()">Cari</button>
        <button class="btn btn-roomly" type="button" data-bs-toggle="modal" data-bs-target="#registerModal">
            <i class="bi bi-plus-lg"></i>Tambah Pengguna
          </button>
      </div>
      <div class="panel table-responsive">
        <table id="tb" class="table">
          <thead>
            <tr>
              <th>Nama pengguna</th>
              <th>NIM</th>
              <th>Email</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Alya Putri</td>
              <td>23010001</td>
              <td>alya.putri@kampus.ac.id</td>
              <td class="text-end"><button class="btn btn-light-w btn-sm">Edit</button> <button
                  class="btn btn-light-w btn-sm" onclick="hapus(this)">Hapus</button></td>
            </tr>
            <tr>
              <td>Bima Pratama</td>
              <td>23010002</td>
              <td>bima.pratama@kampus.ac.id</td>
              <td class="text-end"><button class="btn btn-light-w btn-sm">Edit</button> <button
                  class="btn btn-light-w btn-sm" onclick="hapus(this)">Hapus</button></td>
            </tr>
            <tr>
              <td>Citra Lestari</td>
              <td>23010003</td>
              <td>citra.lestari@kampus.ac.id</td>
              <td class="text-end"><button class="btn btn-light-w btn-sm">Edit</button> <button
                  class="btn btn-light-w btn-sm" onclick="hapus(this)">Hapus</button></td>
            </tr>
            <tr>
              <td>hadi Saputra</td>
              <td>23010004</td>
              <td>hadi.saputra@kampus.ac.id</td>
              <td class="text-end"><button class="btn btn-light-w btn-sm">Edit</button> <button
                  class="btn btn-light-w btn-sm" onclick="hapus(this)">Hapus</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    function cari() {
      var q = document.getElementById("q").value.toLowerCase();
      document.querySelectorAll("#tb tbody tr").forEach(function (r) { r.style.display = r.cells[0].innerText.toLowerCase().indexOf(q) > -1 ? "" : "none"; });
    }
    function hapus(b) { if (confirm("Hapus pengguna ini?")) b.closest("tr").remove(); }
  </script>
</body>

</html>
